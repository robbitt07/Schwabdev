[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "schwabdev"
version = "4.1.0"
description = "An easy and lightweight wrapper for using the Charles Schwab API."
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{name = "Tyler Bowers"}, {email = "tylerebowers@gmail.com"}]
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "tzdata",
    "aiohttp",
    "requests",
    "websockets",
    "cryptography",
]
keywords = [
    "python", 
    "schwab", 
    "api", 
    "client", 
    "finance", 
    "trading", 
    "stocks", 
    "equities", 
    "options", 
    "forex", 
    "futures",
]
classifiers=[
    "Topic :: Office/Business :: Financial :: Investment",
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://github.com/tylerebowers/Schwabdev"
Documentation = "https://tylerebowers.github.io/Schwabdev/"
Source = "https://github.com/tylerebowers/Schwabdev"
Youtube = "https://www.youtube.com/playlist?list=PLs4JLWxBQIxpbvCj__DjAc0RRTlBz-TR8"
PyPI = "https://pypi.org/project/schwabdev/"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = "tests/"

[project.optional-dependencies]
context = [
    'schwabdev_context',
]

examples = [
    'python-dotenv',
]

redis = [
    'redis>=4.0',
]

[dependency-groups]
test = [
    'pytest',
    'pytest-asyncio',
    'coverage'
]

security = [
    'pip-audit',
    'pipdeptree'
]


[tool.coverage.run]
omit = [
    "*/tests/*"
]
